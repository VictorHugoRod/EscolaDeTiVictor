[project]
name = "fila-atendimento"
version = "1.0.0"
description = "API REST de senhas para atendimento presencial"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts", "exams", "tests/public"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests/unit"]